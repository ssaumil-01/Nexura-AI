    command: python main.py report
    text: 'TOTAL: 217.00'
- id: inv_bulk_discount
  fixture: inventory_pkg
  title: Bulk discount from configuration
  prompt: Add a bulk discount. Two new settings, bulk_min_qty (default 10) and bulk_discount_percent (default 5), go into the config
    defaults and inventory.json. pricing.line_total(item, cfg=None) applies the discount when cfg is given and item.qty >= cfg["bulk_min_qty"].
    `python main.py report` must use the configured discount.
  checks:
  - type: python
    code: |
      from inventory.config import load_config
      from inventory.models import Item
      from inventory.pricing import line_total
      cfg = {'bulk_min_qty': 10, 'bulk_discount_percent': 5}
      assert line_total(Item('a', 'A', 2.0, 10), cfg) == 19.0
      assert line_total(Item('a', 'A', 2.0, 9), cfg) == 18.0
      assert line_total(Item('a', 'A', 2.0, 10)) == 20.0
      c = load_config()
      assert c['bulk_min_qty'] == 10 and c['bulk_discount_percent'] == 5
      d = load_config('does-not-exist.json')
      assert d['bulk_min_qty'] == 10 and d['bulk_discount_percent'] == 5
  - type: command_ok
    command: python -m pytest -q
    timeout_s: 120
  - type: output_contains
    command: python main.py report
    text: 'TOTAL: 207.65'
