- id: inv_validation
  fixture: inventory_pkg
  title: Validate CSV rows
  prompt: load_items must raise ValueError when a row has a negative price or quantity. The message must contain the CSV line number
    (the header is line 1).
  checks:
  - type: python
    code: |
      from inventory.storage import load_items
      open('bad.csv', 'w', encoding='utf-8').write('sku,name,price,qty\nA,a,1.0,1\nB,b,-2.0,1\n')
      try:
          load_items('bad.csv')
      except ValueError as e:
          assert '3' in str(e), str(e)
      else:
          raise AssertionError('no ValueError')
      open('bad2.csv', 'w', encoding='utf-8').write('sku,name,price,qty\nA,a,1.0,-1\n')
      try:
          load_items('bad2.csv')
      except ValueError as e:
          assert '2' in str(e), str(e)
      else:
          raise AssertionError('no ValueError for negative qty')
      assert len(load_items()) == 4
  - type: command_ok
    command: python -m pytest -q
    timeout_s: 120
- id: bs_fix_bug
  fixture: buggy_shop
  title: Fix the seeded bug
  prompt: A test in tests/test_cart.py fails. Find and fix the bug in the shop package without changing the tests.
  checks:
  - type: command_ok
    command: python -m pytest -q
    timeout_s: 120
  - type: python
    code: |
      from shop.discounts import apply_discount
      assert apply_discount(200, 25) == 150
      import pathlib
      assert 'assert c.total() == 17.1' in pathlib.Path('tests/test_cart.py').read_text(encoding='utf-8')
- id: bs_grand_total
  fixture: buggy_shop
  title: Shipping and grand total
  prompt: Add Cart.shipping(), which is 4.99 when total() is below 50 and 0 otherwise, and Cart.grand_total() = total() + shipping(),
    rounded to 2 decimals. Do not change total().
  checks:
  - type: python
    code: |
      from shop.cart import Cart
      c = Cart(); c.add('cheese')
      assert c.shipping() == 4.99 and c.grand_total() == 10.99
      d = Cart(); d.add('coffee', 6)
      assert d.shipping() == 0 and d.grand_total() == 57.0
      assert d.total() == 57.0
- id: bs_coupons
  fixture: buggy_shop
  title: Coupon codes
  prompt: 'Add coupon codes. Create shop/coupons.py with COUPONS = {"SAVE10": 10, "HALF": 50}. Cart.apply_coupon(code) sets the cart''s
    discount percent from the coupon; codes are case-insensitive and an unknown code raises ValueError.'
  checks:
  - type: python
    code: |
      from shop.cart import Cart
      from shop.coupons import COUPONS
      assert COUPONS == {'SAVE10': 10, 'HALF': 50}
      c = Cart()
      c.apply_coupon('half')
      assert c.discount_percent == 50
      c.apply_coupon('SAVE10')
      assert c.discount_percent == 10
      try:
          c.apply_coupon('NOPE')
      except ValueError:
          pass
      else:
          raise AssertionError('unknown coupon accepted')
- id: bs_remove
  fixture: buggy_shop
  title: Remove items from the cart
  prompt: Add Cart.remove(product, qty=None). Without qty the whole line is removed; with qty the quantity goes down and the line disappears
    at 0. Removing a product that is not in the cart raises KeyError.
  checks:
  - type: python
    code: |
      from shop.cart import Cart
      c = Cart(); c.add('apple', 4); c.add('bread')
      c.remove('apple', 1)
      assert c.lines == {'apple': 3, 'bread': 1}
      c.remove('apple', 3)
      assert c.lines == {'bread': 1}
      c.remove('bread')
      assert c.lines == {}
      try:
          c.remove('cheese')
      except KeyError:
          pass
      else:
          raise AssertionError('removing a missing product must raise KeyError')
